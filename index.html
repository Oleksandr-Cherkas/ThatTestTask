<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Sphere Sync</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;        /* канвас на весь екран / full-screen canvas, no scrollbars */
            background-color: #111;  /*  майже чорний фон/ nearly black so the bloom reads well */
        }
        canvas {
            display: block;          /* прибираємо зайвий відступ під inline-канвасом / kill the inline-canvas gap */
        }
    </style>

    <!--
      three.js з CDN - потрібен HTTP-сервер (див. README)
      three.js straight from a CDN - it needs an HTTP server (see README)
    -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>
    <!-- логіка тут / all the logic -->
    <script type="module" src="./main.js"></script>
</body>
</html>
